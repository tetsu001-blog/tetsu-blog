name: Daily Build (Scheduled)

on:
  push:
    paths:
      - '.github/workflows/schedule-build.yml'
  schedule:
    # 毎日 UTC 08:15 (日本時間 17:15) に実行
    - cron: '15 8 * * *'
  # 手動実行用 (テストなどのため)
  workflow_dispatch:

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        # Settings > Secrets and variables > Actions で
        # 登録した `CF_PAGES_DEPLOY_HOOK_URL` にリクエストを投げる
        run: |
          if [ -z "${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: CF_PAGES_DEPLOY_HOOK_URL is not set"
            exit 1
          fi
          curl -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}"

      - name: Wait for Cloudflare Pages build to finish
        run: sleep 180

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # atproto は Python 3.15 未満まで対応。固定しないと Python 3.15 解決時に
          # pip が古い atproto へ自動退行し typing_extensions の import で落ちる
          python-version: '3.14'

      - name: Install dependencies
        # 上限なしの指定だと Python 非対応時に pip が黙って旧版へ退行するため
        # 明示的にバージョン指定し、解決できなければエラーにする
        run: pip install 'atproto>=0.0.70' Pillow

      - name: Auto Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python .github/scripts/auto_bsky.py
